<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miserly - Log in</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="card">
        <p class="brand">Miserly</p>
        <h1>Log in</h1>

        <!-- Jinja displays this paragraph only when Python supplies an error. -->
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <!-- POST sends these fields to the /login function in main.py. -->
        <form action="/login" method="post">
            <!-- This hidden value lets Python check that the form belongs to this session. -->
            <input type="hidden" name="form_token" value="{{ session['form_token'] }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>

            <button type="submit">Log in</button>
        </form>
        <p>New here? <a href="/register">Create an account</a></p>
    </main>
</body>
</html>
