<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miserly - Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="card">
        <p class="brand">Miserly</p>
        <h1>Create an account</h1>

        <!-- error is a message supplied by the registration function. -->
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form action="/register" method="post">
            <input type="hidden" name="form_token" value="{{ session['form_token'] }}">

            <!-- name="name" tells Python which submitted value this is. -->
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

            <label for="password">Password (8 to 128 characters)</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <button type="submit">Create account</button>
        </form>
        <p>Already registered? <a href="/login">Log in</a></p>
    </main>
</body>
</html>
