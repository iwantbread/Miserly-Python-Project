<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miserly - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="card">
        <p class="brand">Miserly</p>
        <!-- Python supplies name; Jinja inserts it inside the braces. -->
        <h1>Hello, {{ name }}!</h1>
        <p>You are logged in.</p>
        <p>Your team can add the business tracker features here later.</p>

        <!-- Logout is a form submission, just like login. -->
        <form action="/logout" method="post">
            <input type="hidden" name="form_token" value="{{ session['form_token'] }}">
            <button type="submit">Log out</button>
        </form>
    </main>
</body>
</html>
