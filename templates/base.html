<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Miserly{% endblock %} · Business tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><a class="brand" href="{{ url_for('index') }}"><b>m.</b> Miserly</a><span class="tagline">Small steps. Smarter business.</span>
    {% if g.user %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary" type="submit">Log out</button></form>{% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Miserly · Your business, in balance.</footer>
</body>
</html>
